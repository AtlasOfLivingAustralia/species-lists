# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven
on:
  push:
    branches: [ main, testing, develop ]
    paths:
      - 'lists-service/**'
      - '.github/workflows/maven.yml'
  pull_request:
    branches: [ main, testing, develop ]
    paths:
      - 'lists-service/**'
    
permissions:
  contents: write           # Required to submit the Dependency Graph snapshot
  checks: write             # Required for dorny/test-reporter to create "Maven Tests"
  pull-requests: write      # Required for dorny/test-reporter to link to PRs

env:
  # Customize these environment variables
  JAVA_APP_PATH: './lists-service'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/lists-service


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    # `verify` rather than `test`: it runs the unit tests, then the *IT integration tests, which
    # start MongoDB and Elasticsearch through Testcontainers (Docker is available on the GitHub
    # runners), then the coverage report and its minimum, and packages the jar. The old separate
    # `mvn package` step is part of this.
    - name: Run tests
      working-directory: ${{ env.JAVA_APP_PATH }}
      run: mvn -B verify --file pom.xml
    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Maven Tests
        # Comma-separated (the action does not split on newlines), and only the TEST-*.xml reports:
        # failsafe-reports also holds failsafe-summary.xml, which is not JUnit and breaks the parser
        path: ${{ env.JAVA_APP_PATH }}/target/surefire-reports/TEST-*.xml,${{ env.JAVA_APP_PATH }}/target/failsafe-reports/TEST-*.xml
        reporter: java-junit
        fail-on-error: true
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: jacoco-report
        path: ${{ env.JAVA_APP_PATH }}/target/site/jacoco/
        retention-days: 14

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
      with:
        directory: ${{ env.JAVA_APP_PATH }}
        token: ${{ secrets.GITHUB_TOKEN }}
