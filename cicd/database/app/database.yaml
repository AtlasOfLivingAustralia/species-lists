AWSTemplateFormatVersion: '2010-09-09'

Description: 'A DocumentDB Cluster, provisioned or serverless (Serverless V2)'

Parameters:
  pAdminUser:
    Description: The username for the DocumentDB admin user
    Type: String
    Default: admin
  pBackupRetentionPeriod:
    Description: The number of days to retain backups for
    Type: Number
    Default: 7
  pBuild:
    Description: The CodeBuild build number
    Type: Number
  pCleanBranch:
    Description: The clean branch
    Type: String
  pDbEngineVersion:
    Description: The DocumentDB engine version
    Type: String
    Default: 4.0.0
  pDbMode:
    Description: >-
      The capacity mode of the DocumentDB cluster. Serverless (Serverless V2)
      requires an engine version of 5.0.0 or later.
    Type: String
    AllowedValues:
      - provisioned
      - serverless
    Default: provisioned
  pDbParameterGroupFamily:
    Description: The DocumentDB parameter group family
    Type: String
    Default: docdb4.0
  pEnablePerformanceInsights:
    Description: Set performance insights on or off for the DocumentDB instance
    Type: String
    AllowedValues:
      - "true"
      - "false"
  pEnvironment:
    Description: Environment for this DocumentDB instance
    AllowedValues:
      - development
      - testing
      - staging
      - production
    Type: String
  pInstanceClass:
    Description: The DocumentDB instance class, only used when pDbMode is provisioned
    Type: String
    Default: db.t4g.medium
  pInstanceCount:
    Description: The number of instances in the DocumentDB cluster
    Type: Number
    Default: 1
  pProductName:
    Description: The product name
    Type: String
  pServerlessMaxCapacity:
    Description: The maximum capacity in DCUs, only used when pDbMode is serverless
    Type: Number
    MinValue: 1
    MaxValue: 256
    Default: 2
  pServerlessMinCapacity:
    Description: The minimum capacity in DCUs, only used when pDbMode is serverless
    Type: Number
    MinValue: 0.5
    MaxValue: 256
    Default: 0.5
  pVpcStackName:
    Description: The name of the Bedrock VPC stack
    Type: String

Conditions:
  IsDev: !Equals
    - !Ref pEnvironment
    - development
  IsProd: !Equals
    - !Ref pEnvironment
    - production
  IsProvisioned: !Equals
    - !Ref pDbMode
    - provisioned
  IsServerless: !Equals
    - !Ref pDbMode
    - serverless

Resources:

  DocDbSubnetGrp:
    Type: AWS::DocDB::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: DocumentDB subnet group
      SubnetIds: !Split
        - ','
        - Fn::ImportValue:
            Fn::Sub: ${pVpcStackName}-PriSubnets
      Tags:
        - Key: Name
          Value: !Sub
            - ${pProductName}-${ResourceName}-subnet-group
            - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]

  DocDbSecurityGrp:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow access from the VPC
      VpcId:
        Fn::ImportValue:
          Fn::Sub: ${pVpcStackName}-Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 27017
          ToPort: 27017
          CidrIp:
            Fn::ImportValue:
              Fn::Sub: ${pVpcStackName}-VpcCidr
      Tags:
        - Key: Name
          Value: !Sub
            - ${pProductName}-${ResourceName}-security-group
            - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]

  DocDbClusterParameterGroup:
    Type: AWS::DocDB::DBClusterParameterGroup
    Properties:
      Name: !Sub
        - ${pProductName}-${ResourceName}-cluster-pg8
        - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      Description: DocumentDB cluster parameter group
      Family: !Ref pDbParameterGroupFamily
      Parameters:
        tls: enabled
        audit_logs: enabled
        ttl_monitor: enabled
      Tags:
        - Key: Name
          Value: !Sub
            - ${pProductName}-${ResourceName}-cluster-pg
            - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]

  DocDbCluster:
    Type: AWS::DocDB::DBCluster
    Properties:
      CopyTagsToSnapshot: true
      BackupRetentionPeriod: !Ref pBackupRetentionPeriod
      DBClusterIdentifier: !Sub
        - ${pProductName}-${ResourceName}-cluster
        - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      DBClusterParameterGroupName: !Ref DocDbClusterParameterGroup
      DBSubnetGroupName: !Ref DocDbSubnetGrp
      DeletionProtection: !If [ IsProd, true, false ]
      EngineVersion: !Ref pDbEngineVersion
      MasterUsername: !Ref pAdminUser
      MasterUserPassword: !Sub
        - '{{resolve:secretsmanager:lists-${ResourceName}:SecretString:db-password}}'
        - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      PreferredBackupWindow: 16:00-17:00
      PreferredMaintenanceWindow: tue:17:00-tue:19:00
      ServerlessV2ScalingConfiguration: !If
        - IsServerless
        - MinCapacity: !Ref pServerlessMinCapacity
          MaxCapacity: !Ref pServerlessMaxCapacity
        - !Ref AWS::NoValue
      StorageEncrypted: true
      Tags:
        - Key: Name
          Value: !Sub
            - ${pProductName}-${ResourceName}-cluster
            - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      VpcSecurityGroupIds:
        - !Ref DocDbSecurityGrp

  DocDbInstance:
    Type: AWS::DocDB::DBInstance
    Condition: IsProvisioned
    Properties:
      DBClusterIdentifier: !Ref DocDbCluster
      DBInstanceClass: !Ref pInstanceClass
      AutoMinorVersionUpgrade: true
      EnablePerformanceInsights: !Ref pEnablePerformanceInsights
      Tags:
        - Key: Name
          Value: !Sub
            - ${pProductName}-${ResourceName}-instance
            - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]

  DocDbServerlessInstance:
    Type: AWS::DocDB::DBInstance
    Condition: IsServerless
    Properties:
      DBClusterIdentifier: !Ref DocDbCluster
      DBInstanceClass: db.serverless
      AutoMinorVersionUpgrade: true
      EnablePerformanceInsights: !Ref pEnablePerformanceInsights
      Tags:
        - Key: Name
          Value: !Sub
            - ${pProductName}-${ResourceName}-instance
            - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]

Outputs:

  DocDbMode:
    Description: The capacity mode of the DocumentDB cluster
    Value: !Ref pDbMode
    Export:
      Name: !Sub ${AWS::StackName}-DocDbMode

  DocDbUsername:
    Description: The DocumentDB username
    Value: !Ref pAdminUser
    Export: 
      Name: !Sub ${AWS::StackName}-DocDbUsername

  DocDbClusterEndpoint:
    Description: The endpoint of the DocumentDB cluster
    Value: !GetAtt DocDbCluster.Endpoint
    Export:
      Name: !Sub ${AWS::StackName}-DocDbClusterEndpoint
  
  DocDbClusterReaderEndpoint:
    Description: The reader endpoint of the DocumentDB cluster
    Value: !GetAtt DocDbCluster.ReadEndpoint
    Export:
      Name: !Sub ${AWS::StackName}-DocDbClusterReaderEndpoint